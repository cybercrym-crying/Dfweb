<style>
:root{--ink:#000;--dim:rgba(255,255,255,.62);--line:rgba(255,255,255,.22);
--sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;--disp:'Doto','Arial Black',Impact,sans-serif;--mono:'Martian Mono',ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ink);color:#fff;font:400 1.05rem/1.6 var(--sans)}
a,button{color:inherit;text-decoration:none;font:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:4px}
@media (pointer:fine){body,a,button,.tag,.readout{cursor:none}}

#ring,#dot,#chx,#chy{position:fixed;left:0;top:0;pointer-events:none;opacity:0}
#ring,#dot{z-index:99;mix-blend-mode:difference;background:#fff}
#ring{width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:transparent;border:1.5px solid #fff;transition:width .2s,height .2s,margin .2s,background .2s}
#dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%}
#ring.hot{width:72px;height:72px;margin:-36px 0 0 -36px;background:#fff}
#chx{width:100%;height:1px;background:rgba(255,255,255,.16);z-index:4}
#chy{width:1px;height:100%;background:rgba(255,255,255,.16);z-index:4}
#lab{position:fixed;left:0;top:0;z-index:98;pointer-events:none;opacity:0;font:400 .66rem/1.5 var(--mono);background:#000;border:1px solid #fff;padding:.3rem .5rem;white-space:nowrap;transition:opacity .15s}
@media (pointer:coarse){#ring,#dot,#chx,#chy,#lab{display:none}}

nav{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:1.4rem clamp(1.2rem,4vw,3rem)}
.logo{font:800 1.5rem/1 var(--disp);letter-spacing:.04em;background:none;border:0;padding:0;color:#fff}
.logo .b{display:none;font:400 .7rem/1 var(--mono);letter-spacing:0}
.logo:hover .a{display:none}.logo:hover .b{display:inline}
.nr{display:flex;gap:1.6rem;align-items:center;font:400 .75rem/1 var(--mono);color:var(--dim)}
.nr a{color:#fff;border-bottom:1px solid #fff;padding-bottom:.2rem}
.live::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:#fff;margin-right:.5rem;animation:bl 1.4s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:6rem clamp(1.2rem,4vw,3rem) 2.4rem;overflow:hidden;border-bottom:1px solid var(--line)}
#field{position:absolute;inset:0;z-index:0}
.hero>*:not(canvas):not(nav){position:relative;z-index:2}
h1{margin:0;font:900 clamp(2.4rem,6.6vw,6.8rem)/1 var(--disp);max-width:13ch;pointer-events:none;text-shadow:0 0 22px #000}
.hero-foot{display:grid;grid-template-columns:minmax(0,34rem) 1fr;gap:2rem;align-items:end;margin-top:2.2rem}
.hero p{margin:0 0 1.4rem;color:var(--dim);max-width:34rem;text-shadow:0 0 12px #000}
.btns{display:flex;gap:.8rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.9rem 1.4rem;border:1.5px solid #fff;font-weight:600;background:#000;transition:background .15s,color .15s}
.btn.solid{background:#fff;color:#000}
.btn:hover{background:#fff;color:#000}.btn.solid:hover{background:#000;color:#fff}
.readout{justify-self:end;text-align:right;font:400 .72rem/1.8 var(--mono);color:var(--dim);background:#000;padding:.6rem .8rem;border:1px solid var(--line)}
.readout b{color:#fff;font-weight:700}
@media (max-width:720px){.hero-foot{grid-template-columns:1fr}.readout{justify-self:start;text-align:left}}

.hero>.log,.hero>.tag{z-index:3;font:400 .7rem/1.65 var(--mono);background:rgba(0,0,0,.78);border:1px solid var(--line)}
.hero>.log{width:min(30rem,42vw);padding:.7rem .9rem;pointer-events:none;margin-bottom:1.6rem}
.hero>.tag{position:absolute}
.log .hd{display:flex;justify-content:space-between;color:#fff;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:.4rem;margin-bottom:.4rem}
.log .ln{display:block;white-space:nowrap;overflow:hidden;color:rgba(255,255,255,.4)}
.log .ln:last-child{color:#fff}
.log .ln:last-child::after{content:"_";animation:bl 1s steps(1) infinite}
.hero>.tag{right:clamp(2.6rem,5vw,4rem);bottom:11.5rem;padding:.7rem .9rem .7rem 1.8rem;color:var(--dim);text-align:left}
.tag b{display:block;color:#fff}
.tag::before{content:"";position:absolute;left:.65rem;top:.95rem;width:.5rem;height:.5rem;border:1.5px solid #fff;border-radius:50%}
.tag.broken b{text-decoration:line-through}.tag.broken::before{background:#fff}
.rule{position:absolute;right:0;top:0;bottom:0;width:14px;z-index:1;pointer-events:none;opacity:.45;
background:repeating-linear-gradient(180deg,#fff 0 1px,transparent 1px 50px) right/14px 100% no-repeat,repeating-linear-gradient(180deg,#fff 0 1px,transparent 1px 10px) right/7px 100% no-repeat}
.rule i{position:absolute;right:18px;font:400 .55rem/1 var(--mono);font-style:normal;color:#fff}
@media (max-width:900px){.hero>.log,.hero>.tag,.rule i{display:none}}

.tick{overflow:hidden;padding:.8rem 0;white-space:nowrap;font:400 .72rem/1 var(--mono);color:var(--dim)}
.tick-in{display:inline-block;animation:tk 45s linear infinite}
.tick span{margin-right:2.2rem}.tick b{color:#fff;font-weight:700;margin-right:2.2rem}
@keyframes tk{to{transform:translateX(-50%)}}


.nr button{background:none;border:0;padding:0;color:inherit;font:inherit}
#cnt{color:var(--dim)}.nr .live{color:var(--dim)}.lgb{color:var(--dim)!important}.lgb span{color:#fff}
.ci{background:none;border:0;padding:0;margin-right:2.4rem;color:var(--dim);font:400 .72rem/1 var(--mono)}
.tick .ci b{color:#fff;font-weight:700;margin-right:.6rem}.ci:hover{color:#fff;text-decoration:underline}.ci.lb{color:#fff;font-weight:700}.ci.rx{letter-spacing:.08em}
.tick:hover .tick-in{animation-play-state:paused}.tick-in.rev{animation-direction:reverse;animation-duration:9s}
.doss{position:fixed;inset:0;z-index:97;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.74)}.doss.on{display:flex}
.paper{background:#fff;color:#000;width:min(36rem,92vw);max-height:86vh;overflow:auto;padding:1.5rem;box-shadow:10px 10px 0 rgba(255,255,255,.22)}
.paper .meta{font:500 .68rem/1.4 var(--mono)}.paper h3{margin:.4rem 0 0;font:900 2.4rem/1.05 var(--disp)}
.paper dt{margin-top:1.1rem;font:700 .68rem/1.4 var(--mono)}.paper dd{margin:.2rem 0 0}
.paper.red .v{background:#000;color:#000}.paper.red .v:hover{color:#fff}
.hash{margin-top:1.2rem;font:400 .64rem/1.5 var(--mono);word-break:break-all;opacity:.7}
.paper .row{display:flex;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.paper button{border:1.5px solid #000;background:#fff;color:#000;padding:.5rem .8rem;font:600 .8rem var(--sans)}.paper button:hover{background:#000;color:#fff}
@media (pointer:fine){.hash,.paper *,.doss{cursor:none}}
#toast{position:fixed;left:50%;bottom:4rem;transform:translate(-50%,20px);z-index:100;background:#fff;color:#000;font:500 .78rem/1.5 var(--mono);padding:.7rem 1rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.neg .hero,.neg .tick{filter:invert(1)}
@media (prefers-reduced-motion:reduce){.tick-in,.live::before,.log .ln:last-child::after{animation:none!important}}
</style>
</head>

   a:[`Metadata dokumen Word yang dihapus.`,`Metadata of a deleted Word document.`],s:[`Menghapus berkas tidak sama dengan menghilangkan jejaknya.`,`Deleting a file is not the same as erasing its trace.`]},

   a:[`Akun media sosial, kanal Telegram, dan jejak unggahan data.`,`Social media accounts, Telegram channels, and data-dump traces.`],s:[`Menghubungkan akun ke seorang manusia butuh bukti berlapis.`,`Linking an account to a human being takes layered evidence.`]}

  $('rdb').addEventListener('click',function(){var r=$('paper').classList.toggle('red');if(r)egg('redact',L('Dokumen diredaksi. Arahkan kursor untuk "membocorkan".','Document redacted. Hover to "leak" it.'))});
  $('nxb').addEventListener('click',function(){var j;do{j=Math.random()*C.length|0}while(j===open);openD(j)});
  $('dhash').addEventListener('click',function(){egg('hash',L('Ubah satu huruf saja, hash-nya berubah total.','Change a single letter and the hash changes completely.'))});
  $('tick').addEventListener('click',function(e){

  });

  /* ---------- kursor ---------- */
  var ring=$('ring'),dot=$('dot'),chx=$('chx'),chy=$('chy'),lab=$('lab');
  var rx=0,ry=0,mx=0,my=0,hits=0,idleT;
  function idleReset(){clearTimeout(idleT);idleT=setTimeout(function(){log(L('sesi tidak aktif','session inactive'));egg('idle',L('Kursor diam 15 detik. Sesi dianggap ditinggalkan.','Cursor still for 15 seconds. Session considered abandoned.'))},15000)}
  function move(e){
    var p=e.touches?e.touches[0]:e,r=hero.getBoundingClientRect();

  }

  document.addEventListener('pointerover',function(e){ring.classList.toggle('hot',!!(e.target.closest&&e.target.closest('a,button,.tag,.readout,.hash')))});
  idleReset();

  /* ---------- interaksi ---------- */
  hero.addEventListener('pointerdown',function(e){

  hero.addEventListener('contextmenu',function(){log(L('klik kanan: tidak ada metadata tersembunyi di sini','right-click: no hidden metadata here'));egg('rclick',L('Metadata? Coba lihat <meta> di sumber halaman.','Metadata? Try the <meta> in the page source.'))});

    log(broken?L('PERINGATAN segel dibuka tanpa berita acara','WARNING seal opened without a record'):L('segel dipasang ulang, hash dihitung ulang','seal replaced, hash recomputed'));

  var MN=[['biner','binary'],['heksadesimal','hexadecimal'],['karakter SIDIK','SIDIK letters']];

  clk.addEventListener('click',function(){tz=tz==='UTC'?'Asia/Jakarta':'UTC';tick();egg('clock',L('Zona waktu mengubah arti stempel waktu. Selalu catat zonanya.','Time zones change what a timestamp means. Always record the zone.'))});
  $('lgb').addEventListener('click',function(){lang=lang==='id'?'en':'id';try{localStorage.setItem('sidik-lang',lang)}catch(e){}apply();egg('lang',L('Bahasa: Indonesia','Language: English'))});
  function wipe(){dis=performance.now();log(L('menghapus data...','deleting data...'));egg('wipe',L('Data dihapus. Tenang, jangan dimatikan.','Data deleted. Stay calm, do not power off.'));
    setTimeout(function(){log(L('carving: struktur berkas ditemukan','carving: file structure found'))},1100);
    setTimeout(function(){log(L('pemulihan 100%, hash cocok','recovery 100%, hash match'));say(L('Dipulihkan. Itulah gunanya forensik.','Recovered. That is what forensics is for.'))},2600)}
  function binaryH1(){var h=$('h1'),o=h.textContent;h.style.fontSize='clamp(1.6rem,4vw,4.2rem)';h.textContent='01001010 01000101 01001010 01000001 01001011';egg('binary',L('JEJAK, dalam biner.','TRACE, in binary... (JEJAK).'));setTimeout(function(){h.style.fontSize='';apply()},3500)}

  var KO=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'],ki=0,typed='',hid=false;
  addEventListener('keydown',function(e){
    idleReset();

    if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();fz=!fz;egg('freeze',fz?L('Bukti dibekukan. Tidak ada yang berubah.','Evidence frozen. Nothing changes.'):L('Bukti dilepas.','Evidence released.'));log(fz?L('bukti dibekukan','evidence frozen'):L('bukti dilepas','evidence released'))}
    ki=(e.key===KO[ki])?ki+1:(e.key===KO[0]?1:0);

  console.log('%cSIDIK','font:900 28px monospace',L('\nAnda sedang memeriksa halaman ini. Kami suka itu.\nPetunjuk: <meta name="jejak">, ↑↑↓↓←→←→ B A, panel koordinat, label bukti, jam di navigasi, pita kasus (coba shift+klik), spasi, klik kanan, diam 15 detik.\nBeberapa kata punya arti di sini. Ketik saja.','\nYou are inspecting this page. We like that.\nHints: <meta name="jejak">, ↑↑↓↓←→←→ B A, the coordinate panel, the evidence tag, the nav clock, the case ticker (try shift+click), space, right-click, stay idle for 15 seconds.\nSome words mean something here. Just type.'));

  var bx=$('bx'),by=$('by'),bo=$('bo');
  function bin(v){return (Math.max(0,Math.round(v))&255).toString(2).padStart(8,'0')}
  function hex(v){return '0x'+(Math.max(0,v)>>>0).toString(16).toUpperCase().padStart(6,'0')}
  var R=150;

  function frame(){
    var t=performance.now();
    rx+=(mx-rx)*.18;ry+=(my-ry)*.18;

    lab.style.transform='translate('+(rx+22)+'px,'+(ry+22)+'px)';

    else{yT=-.3+(calm?0:Math.sin(t/2600)*.55);pT=-.05+(calm?0:Math.sin(t/3300)*.12)}
    if(!fz){yaw+=(yT-yaw)*.06;pit+=(pT-pit)*.06}

      for(var i=0;i<A.length;i++){var a=A[i];ctx.fillText(a.b,a.x*W,a.y*H)}
      var cY=Math.cos(yaw),sY=Math.sin(yaw),cP=Math.cos(pit),sP=Math.sin(pit);
      var scanY=((t/7)%620)-310,k,j;hits=0;
      var ds=0;if(dis){var e=t-dis;if(e<900)ds=Math.pow(e/900,2);else if(e<2600)ds=Math.pow(1-(e-900)/1700,2);else dis=0}
      for(j=sw.length-1;j>=0;j--){sw[j].r=(t-sw[j].t0)*.9;if(sw[j].r>Math.max(W,H)*1.3)sw.splice(j,1)}
      for(var i2=0;i2<P.length;i2++){
        var p=P[i2],x1=p.x*cY+p.z*sY,z1=-p.x*sY+p.z*cY;
        var y2=p.y*cP-z1*sP,z2=p.y*sP+z1*cP;
        var f=900/(900-z2),sx=ox+x1*sc*f,sy=oy-y2*sc*f;
        k=0;
        if(on&&!rm){
          var dx=sx-cx,dy=sy-cy,d=Math.sqrt(dx*dx+dy*dy);
          if(d<R){k=1-d/R;sx+=dx/(d+1)*k*16;sy+=dy/(d+1)*k*16;if(!fz&&Math.random()<k*.3)flip(p);if(k>.5)hits++}
        }
        var w=0;
        for(j=0;j<sw.length;j++){
          var q=sw[j],ex=sx-q.x,ey=sy-q.y,ed=Math.sqrt(ex*ex+ey*ey)||1,df=Math.abs(ed-q.r);
          if(df<70){var ww=1-df/70;sx+=ex/ed*ww*26;sy+=ey/ed*ww*26;if(ww>w)w=ww;if(Math.random()<ww*.4)flip(p)}
        }
        if(!calm&&Math.random()<.0015)flip(p);
        var zn=Math.min(1,Math.max(0,(z2+140)/280)),al=(.18+.82*zn)*Math.min(1,p.t*1.4)+k*.8+w*.9;
        if(ds>0){sx+=p.vx*ds*260;sy+=p.vy*ds*260;al*=1-ds*.5}
        if(!calm&&Math.abs(p.y-scanY)<8)al=1;
        ctx.fillStyle=shades[Math.max(0,Math.min(9,Math.floor(al*10)))];
        ctx.fillText(ch(p),sx,sy);
      }
      if(hits>24){lab.textContent=L('sampel: jaringan tangan / kecocokan ','sample: hand tissue / match ')+Math.min(99,Math.round(hits/8))+'%';lab.style.opacity=1}else lab.style.opacity=0;
      bx.textContent=bin(cx<0?0:cx);by.textContent=bin(cy<0?0:cy);
      bo.textContent=hex(Math.max(0,Math.round(cy))*Math.round(W)+Math.max(0,Math.round(cx)));
    }
    requestAnimationFrame(frame);
  }
  apply();frame();
})();
