<style>
:root{--ink:#000;--lum:#78e2ff;--dim:rgba(255,255,255,.62);--line:rgba(255,255,255,.22);
--sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;--disp:'Doto','Arial Black',Impact,sans-serif;--mono:'Martian Mono',ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ink);color:#fff;font:400 1.05rem/1.6 var(--sans)}
a,button{color:inherit;text-decoration:none;font:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:4px}
@media (pointer:fine){body,a,button,.tag,.readout{cursor:none}}

#ring,#dot,#chx,#chy{position:fixed;left:0;top:0;pointer-events:none;opacity:0}
#ring,#dot{z-index:99;mix-blend-mode:difference;background:#fff}
#ring{width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:transparent;border:1.5px solid #fff;transition:width .2s,height .2s,margin .2s,background .2s}
#dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%}
#ring.hot{width:72px;height:72px;margin:-36px 0 0 -36px;background:#fff}
#ring.grab{width:52px;height:52px;margin:-26px 0 0 -26px;border-style:dashed}
#chx{width:100%;height:1px;background:rgba(255,255,255,.16);z-index:4}
#chy{width:1px;height:100%;background:rgba(255,255,255,.16);z-index:4}
#lab{position:fixed;left:0;top:0;z-index:98;pointer-events:none;opacity:0;font:400 .66rem/1.5 var(--mono);background:#000;border:1px solid #fff;padding:.3rem .5rem;white-space:nowrap;transition:opacity .15s}
@media (pointer:coarse){#ring,#dot,#chx,#chy,#lab{display:none}}

nav{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:1.4rem clamp(1.2rem,4vw,3rem)}
.logo{font:800 1.5rem/1 var(--disp);letter-spacing:.04em;background:none;border:0;padding:0;color:#fff}
.logo .b{display:none;font:400 .7rem/1 var(--mono);letter-spacing:0}
.logo:hover .a{display:none}.logo:hover .b{display:inline}
.nr{display:flex;gap:1.6rem;align-items:center;font:400 .75rem/1 var(--mono);color:var(--dim)}
.nr a{color:#fff;border-bottom:1px solid #fff;padding-bottom:.2rem}
.nr button{background:none;border:0;padding:0;color:inherit;font:inherit}
.nr .vb{border:1px solid rgba(255,255,255,.55);padding:.4rem .6rem;color:#fff;letter-spacing:.08em;font-weight:700;transition:background .15s,color .15s}
.nr .vb:hover{background:#fff;color:#000}
#cnt{color:var(--dim)}#cnt:hover{color:#fff;text-decoration:underline}
.nr .live{color:var(--dim)}.lgb{color:var(--dim)!important}.lgb span{color:#fff}
.live::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--lum);box-shadow:0 0 8px var(--lum);margin-right:.5rem;animation:bl 1.4s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (max-width:720px){.nr{gap:.7rem}.nr .vb{padding:.3rem .45rem}}

.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:6rem clamp(1.2rem,4vw,3rem) 2.4rem;overflow:hidden;border-bottom:1px solid var(--line);touch-action:pan-y}
#field{position:absolute;inset:0;z-index:0}
.hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 40%,transparent 50%,rgba(0,0,0,.72) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
.hero-foot{animation:rise .9s .6s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
h1{transition:text-shadow .3s}h1.lit{text-shadow:0 0 22px #000,0 0 28px rgba(120,226,255,.35)}
.hero>*:not(canvas):not(nav){position:relative;z-index:2}
h1{margin:0;font:900 clamp(2.1rem,4.9vw,5rem)/1.02 var(--disp);max-width:24ch;pointer-events:none;text-shadow:0 0 22px #000,0 0 6px #000}
.hero-foot{display:grid;grid-template-columns:minmax(0,34rem) 1fr;gap:2rem;align-items:end;margin-top:1.8rem}
.hero p{margin:0 0 1.4rem;color:var(--dim);max-width:34rem;text-shadow:0 0 12px #000}
.btns{display:flex;gap:.8rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.9rem 1.4rem;border:1.5px solid #fff;font-weight:600;background:#000;transition:background .15s,color .15s}
.btn.solid{background:#fff;color:#000}
.btn:hover{background:#fff;color:#000}.btn.solid:hover{background:#000;color:#fff}
.readout{justify-self:end;text-align:right;font:400 .72rem/1.8 var(--mono);color:var(--dim);background:#000;padding:.6rem .8rem;border:1px solid var(--line)}
.readout b{color:#fff;font-weight:700}
@media (max-width:720px){.hero-foot{grid-template-columns:1fr}.readout{justify-self:start;text-align:left}}

.hero>.log,.hero>.tag{z-index:3;font:400 .66rem/1.65 var(--mono);background:rgba(0,0,0,.78);border:1px solid var(--line)}
.hero>.log{position:absolute;left:clamp(1.2rem,4vw,3rem);top:5.2rem;width:min(25rem,34vw);padding:.6rem .8rem;pointer-events:none}
.hero>.tag{position:absolute}
.log .hd{display:flex;justify-content:space-between;color:#fff;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:.4rem;margin-bottom:.4rem}
.log .ln{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.4)}
.log .ln:last-child{color:#fff}
.log .ln:last-child::after{content:"_";animation:bl 1s steps(1) infinite}
.hero>.tag{right:clamp(2.6rem,5vw,4rem);bottom:12rem;padding:.7rem .9rem .7rem 1.8rem;color:var(--dim);text-align:left}
.tag b{display:block;color:#fff}
.tag::before{content:"";position:absolute;left:.65rem;top:.95rem;width:.5rem;height:.5rem;border:1.5px solid #fff;border-radius:50%}
.tag.broken b{text-decoration:line-through}.tag.broken::before{background:#fff}
.rule{position:absolute;right:0;top:0;bottom:0;width:14px;z-index:1;pointer-events:none;opacity:.45;
background:repeating-linear-gradient(180deg,#fff 0 1px,transparent 1px 50px) right/14px 100% no-repeat,repeating-linear-gradient(180deg,#fff 0 1px,transparent 1px 10px) right/7px 100% no-repeat}
.rule i{position:absolute;right:18px;font:400 .55rem/1 var(--mono);font-style:normal;color:#fff}
@media (max-width:900px){.hero>.log,.hero>.tag,.rule i{display:none}}

.tick{overflow:hidden;padding:.8rem 0;white-space:nowrap;font:400 .72rem/1 var(--mono);color:var(--dim)}
.tick-in{display:inline-block;animation:tk 45s linear infinite}
@keyframes tk{to{transform:translateX(-50%)}}
.ci{background:none;border:0;padding:0;margin-right:2.4rem;color:var(--dim);font:400 .72rem/1 var(--mono)}
.tick .ci b{color:#fff;font-weight:700;margin-right:.6rem}.ci:hover{color:#fff;text-decoration:underline}.ci.lb{color:#fff;font-weight:700}.ci.rx{letter-spacing:.08em}
.tick:hover .tick-in{animation-play-state:paused}.tick-in.rev{animation-direction:reverse;animation-duration:9s}

.doss{position:fixed;inset:0;z-index:97;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.74)}.doss.on{display:flex}
.paper{background:#fff;color:#000;width:min(36rem,92vw);max-height:86vh;overflow:auto;padding:1.5rem;box-shadow:10px 10px 0 rgba(255,255,255,.22)}
.paper .meta{font:500 .68rem/1.4 var(--mono)}.paper h3{margin:.4rem 0 0;font:900 2.4rem/1.05 var(--disp)}
.paper dt{margin-top:1.1rem;font:700 .68rem/1.4 var(--mono)}.paper dd{margin:.2rem 0 0}
.paper.red .v{background:#000;color:#000}.paper.red .v:hover{color:#fff}
.hash{margin-top:1.2rem;font:400 .64rem/1.5 var(--mono);word-break:break-all;opacity:.7}
.paper .row{display:flex;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.paper button{border:1.5px solid #000;background:#fff;color:#000;padding:.5rem .8rem;font:600 .8rem var(--sans)}.paper button:hover{background:#000;color:#fff}
.bar{height:6px;border:1px solid #000;margin-top:.8rem}.bar i{display:block;height:100%;background:#000;box-shadow:inset 0 -2px 0 var(--lum)}
.eg{list-style:none;margin:1rem 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:.15rem 1rem;font:400 .7rem/1.45 var(--mono)}
.eg li{padding:.3rem 0;border-bottom:1px dashed rgba(0,0,0,.25)}
.eg li b{display:block;font-weight:700}.eg li.no{opacity:.55}.eg li.no b{letter-spacing:.12em}
.kv{display:grid;grid-template-columns:8.5rem 1fr;gap:.3rem .8rem;margin-top:1rem;font:400 .74rem/1.5 var(--mono)}.kv span:nth-child(odd){font-weight:700}
@media (pointer:fine){.hash,.paper *,.doss{cursor:none}}
#toast{border-left:4px solid var(--lum);position:fixed;left:50%;bottom:4rem;transform:translate(-50%,20px);z-index:100;background:#fff;color:#000;font:500 .78rem/1.5 var(--mono);padding:.7rem 1rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.neg .hero,.neg .tick{filter:invert(1)}
@media print{.hero{min-height:auto}#field,#ring,#dot,#chx,#chy,#lab,.tick{display:none}}
@media (prefers-reduced-motion:reduce){.tick-in,.live::before,.log .ln:last-child::after,.hero-foot{animation:none!important}}
</style>
</head>

<script>
(function(){

  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lang='id',found={},tz='Asia/Jakarta';

  function L(a,b){return lang==='id'?a:b}

  konami:['Mode negatif','Negative mode','Kode klasik ↑↑↓↓←→←→ B A','Classic code ↑↑↓↓←→←→ B A'],

  logo:['Logo dalam hex','Logo in hex','Klik logo','Click the logo'],

  sudo:['sudo','sudo','Minta hak admin lewat ketikan','Ask for admin rights by typing'],

  tab:['Selamat datang kembali','Welcome back','Tinggalkan tab ini, lalu kembali','Leave this tab, then come back'],
  lang:['Dwibahasa','Bilingual','Ganti bahasa','Switch language'],
  locard:['Prinsip Locard','Locard\'s principle','Klik celah di antara jari','Click the gap between the fingers'],
  locard3:['Kontak berulang','Repeated contact','Sentuhkan jari tiga kali','Make the fingers touch three times'],

  back:['Sisi lain','The other side','Lihat dari belakang','Look from behind'],
  macro:['Makro','Macro','Zoom sampai mentok','Zoom all the way in'],
  finger:['Sidik laten','Latent print','Tahan klik tanpa bergerak','Press and hold without moving'],
  shake:['Guncangan','Shake','Goyangkan kursor dengan cepat','Shake the cursor fast'],
  gravity:['Gravitasi','Gravity','Ketik gaya yang menjatuhkan apel','Type the force that drops apples'],
  enhance:['ENHANCE','ENHANCE','Kata favorit film detektif','Every crime show\'s favorite word'],
  matrix:['Hujan karakter','Character rain','Judul film simulasi 1999','A 1999 simulation movie title'],
  fresco:['Fresko','Fresco','Ketik tahun lukisan ini selesai','Type the year this was finished'],
  exif:['Metadata gambar','Image metadata','Ketik format metadata foto','Type the photo metadata format'],
  whoami:['Identitas','Identity','Tanya sistem siapa dirimu','Ask the system who you are'],
  leet:['1337','1337','Angka favorit peretas','A hacker\'s favorite number'],
  view:['Mode tampilan','View mode','Tombol 3D di navigasi','The 3D button in the nav'],
  anaglyph:['Anaglif','Anaglyph','Siapkan kacamata merah-biru','Get your red-cyan glasses'],
  console:['Konsol','Console','Buka console browser','Open the browser console'],
  copy:['Salinan','Copy','Salin teks apa saja','Copy any text'],
  printdoc:['Cetak','Print','Cetak halaman ini','Print this page'],
  offline:['Terisolasi','Isolated','Putuskan internet','Go offline'],
  luminol:['Luminol','Luminol','Cairan penyidik untuk jejak darah','The investigator\'s blood-trace reagent']};
  var EG=Object.keys(EGI),N=EG.length;
  function nf(){var k=0;for(var i=0;i<N;i++)if(found[EG[i]])k++;return k}
  function updCnt(){$('cnt').textContent=L('jejak ','traces ')+nf()+'/'+N}
  function egg(id,msg){
    if(!found[id]){found[id]=1;try{localStorage.setItem('sidik-eggs',JSON.stringify(found))}catch(e){}
      updCnt();log(L('jejak ditemukan ','trace found ')+nf()+'/'+N+' · '+EGI[id][lang==='id'?0:1]);
      if(nf()===N){msg=L('Semua jejak ditemukan. Kamu penyidik sejati.','All traces found. A true investigator.');
        for(var i=0;i<3;i++)setTimeout(function(){sw.push({x:gapX,y:gapY,t0:performance.now(),r:0})},i*500);setTimeout(touch3,300)}}
    if(msg)say(msg);
  }

  var C=[
  {y:'1995',n:'Mitnick',l:[`pelacakan lewat log dan sinyal ponsel`,`tracked via logs and cell signals`],
   f:[`Pada 15 Februari 1995 Kevin Mitnick ditangkap di Raleigh setelah pakar keamanan Tsutomu Shimomura membantu menelusurinya lewat log jaringan dan sinyal ponsel.`,`On 15 February 1995 Kevin Mitnick was arrested in Raleigh after security expert Tsutomu Shimomura helped trace him through network logs and cell-phone signals.`],
   a:[`Log jaringan dan pelacakan sinyal seluler.`,`Network logs and cell-signal tracking.`],s:[`Log yang rapi bisa menunjukkan siapa, dari mana, dan kapan.`,`Well-kept logs show who, from where, and when.`]},
  {y:'2005',n:'BTK',l:[`metadata dari disket yang "dihapus"`,`metadata from a "deleted" floppy`],
   f:[`Dennis Rader mengirim disket ke stasiun TV di Wichita. Dokumen Word yang sudah dihapus masih menyimpan metadata: "Christ Lutheran Church" dan pengubah terakhir "Dennis". Ia ditangkap 25 Februari 2005.`,`Dennis Rader sent a floppy disk to a Wichita TV station. A deleted Word document still held metadata: "Christ Lutheran Church" and last modified by "Dennis". He was arrested on 25 February 2005.`],
   a:[`Metadata dokumen Word yang dihapus.`,`Metadata of a deleted Word document.`],s:[`Menghapus berkas tidak sama dengan menghilangkan jejaknya.`,`Deleting a file is not the same as erasing its trace.`]},
  {y:'2010',n:'Stuxnet',l:[`malware yang dibedah peneliti`,`malware taken apart by researchers`],

   a:[`Kode malware dan sistem kendali industri (PLC).`,`Malware code and industrial control systems (PLC).`],s:[`Reverse engineering mengungkap target dan tingkat kecanggihan pelaku.`,`Reverse engineering reveals the target and the attacker's sophistication.`]},
  {y:'2011',n:'Casey Anthony',l:[`84 pencarian yang ternyata 1`,`84 searches that were really 1`],
   f:[`Di persidangan, jaksa menyebut ada 84 pencarian "chloroform" di komputer keluarga. Analisis ulang menunjukkan hanya satu kunjungan.`,`At trial, prosecutors cited 84 searches for "chloroform" on the family computer. Re-analysis showed only one visit.`],
   a:[`Riwayat peramban Firefox dan keluaran alat forensik.`,`Firefox browser history and forensic-tool output.`],s:[`Alat forensik bisa keliru. Hasilnya harus diverifikasi silang.`,`Forensic tools can be wrong. Cross-verify the output.`]},
  {y:'2013',n:'Silk Road',l:[`laptop disita saat masih login`,`laptop seized while still logged in`],
   f:[`Ross Ulbricht ditangkap pada 1 Oktober 2013 di perpustakaan umum San Francisco. Agen menyita laptopnya dalam keadaan terbuka dan masuk sebagai admin.`,`Ross Ulbricht was arrested on 1 October 2013 in a San Francisco public library. Agents seized his laptop while it was open and logged in as admin.`],
   a:[`Sesi laptop yang masih aktif (data hidup).`,`The still-active laptop session (live data).`],s:[`Data hidup di memori bisa hilang begitu perangkat dimatikan.`,`Live data in memory can vanish once a device powers off.`]},
  {y:'2014',n:'Sony Pictures',l:[`atribusi lewat infrastruktur yang sama`,`attribution via shared infrastructure`],
   f:[`Setelah peretasan Sony Pictures pada November 2014, FBI menyimpulkan pelakunya adalah Korea Utara, antara lain dari kemiripan malware dan infrastruktur yang dipakai.`,`After the Sony Pictures hack in November 2014, the FBI concluded North Korea was responsible, citing malware similarities and shared infrastructure, among other things.`],
   a:[`Kemiripan kode malware dan alamat IP.`,`Malware code overlaps and IP addresses.`],s:[`Atribusi adalah penilaian, bukan bukti tunggal. Ia bisa diperdebatkan.`,`Attribution is a judgment, not a single proof. It can be disputed.`]},

   a:[`Ponsel terenkripsi dengan batas percobaan PIN.`,`An encrypted phone with a PIN-attempt limit.`],s:[`Enkripsi kuat menyulitkan akuisisi, dan cara masuknya jadi perdebatan hukum dan etika.`,`Strong encryption makes acquisition hard, and how to get in becomes a legal and ethical debate.`]},
  {y:'2016',n:'Kafe Olivier',l:[`CCTV sebagai bukti, keasliannya dipersoalkan`,`CCTV as evidence, its authenticity disputed`],
   f:[`Rekaman CCTV Kafe Olivier jadi bukti penting di kasus "kopi sianida". Pembela mempertanyakan keasliannya dan tidak adanya berita acara pemindahan dari DVR ke flash disk. Jaksa menyatakan rekaman sudah diperiksa ahli forensik digital. Vonis: 20 tahun.`,`CCTV footage from Café Olivier was key evidence in the "cyanide coffee" case. The defense questioned its authenticity and the lack of a handover record from DVR to flash drive. Prosecutors said digital forensic experts had examined it. Verdict: 20 years.`],
   a:[`Rekaman DVR dan berita acara pengambilannya.`,`DVR footage and its acquisition record.`],s:[`Rantai penyimpanan dan berita acara sama pentingnya dengan isi rekaman.`,`Chain of custody and acquisition records matter as much as the footage.`]},
  {y:'2017',n:'WannaCry',l:[`sakelar mati ditemukan di dalam kode`,`a kill switch found inside the code`],
   f:[`WannaCry menyebar ke seluruh dunia pada Mei 2017. Peneliti Marcus Hutchins mendaftarkan domain yang ditemukan di kode malware, dan itu menghentikan penyebarannya.`,`WannaCry spread worldwide in May 2017. Researcher Marcus Hutchins registered a domain found in the malware code, which halted its spread.`],
   a:[`Domain yang tertanam di kode malware.`,`A domain hard-coded in the malware.`],s:[`Membaca kode sampai tuntas kadang menemukan titik lemah penyerang.`,`Reading the code all the way through can reveal the attacker's weak point.`]},
  {y:'2017',n:'Equifax',l:[`147 juta orang, satu celah belum ditambal`,`147 million people, one unpatched flaw`],
   f:[`Peretasan Equifax pada 2017 membuka data sekitar 147 juta orang. Penyusupan memanfaatkan celah Apache Struts yang belum ditambal.`,`The 2017 Equifax breach exposed data on about 147 million people. The intrusion exploited an unpatched Apache Struts flaw.`],
   a:[`Log server web dan riwayat akses.`,`Web server logs and access history.`],s:[`Log yang lengkap menentukan seberapa jauh kerusakan bisa dipastikan.`,`Complete logs determine how far the damage can be established.`]},
  {y:'2022',n:'Bjorka',l:[`akun bukan orang: siapa di baliknya?`,`an account is not a person: who is behind it?`],
   f:[`Pada 2022 polisi menangkap seorang pemuda di Madiun yang dikaitkan dengan jaringan Bjorka, tetapi ia dinilai bukan sosok utamanya. Pada September 2025 polisi menangkap WFT (22) di Minahasa dan menyebutnya pemilik akun @bjorka; klaim itu masih dipertanyakan sebagian pihak.`,`In 2022 police arrested a young man in Madiun linked to the Bjorka network, but he was judged not to be the main figure. In September 2025 police arrested WFT (22) in Minahasa and called him the owner of the @bjorka account; some parties still question that claim.`],
   a:[`Akun media sosial, kanal Telegram, dan jejak unggahan data.`,`Social media accounts, Telegram channels, and data-dump traces.`],s:[`Menghubungkan akun ke seorang manusia butuh bukti berlapis.`,`Linking an account to a human being takes layered evidence.`]}
  ];
